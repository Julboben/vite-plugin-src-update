name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    name: Bump version & tag
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit and tag
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # No dependencies are installed in this job, so no third-party code runs
      # while it can push to the repository.
      - name: Bump version and roll CHANGELOG.md
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version --ignore-scripts
          VERSION=$(node --print "require('./package.json').version")
          node scripts/changelog.mjs release "$VERSION"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "Release v${VERSION}"
          git tag --annotate "v${VERSION}" --message "v${VERSION}"
          # Atomic: either both the commit and the tag land, or neither does.
          git push --atomic origin HEAD:main "v${VERSION}"

  publish:
    name: Publish to npm
    needs: version
    runs-on: ubuntu-latest # must be a GitHub-hosted runner for OIDC
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.version.outputs.version }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm >= 11.5.1; use the version pinned in package.json.
      - name: Install npm from packageManager
        run: npm install --global --ignore-scripts "$(node --print "require('./package.json').packageManager")"

      # Scripts are skipped so no dependency code runs while the OIDC token is
      # available; the build runs explicitly instead of through prepublishOnly.
      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Publish
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          NAME=$(node --print "require('./package.json').name")
          if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already published; skipping."
          else
            npm publish --ignore-scripts
          fi

  github-release:
    name: GitHub release
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.version.outputs.version }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/changelog.mjs notes "$VERSION" > release-notes.md
          gh release create "v${VERSION}" --verify-tag --title "v${VERSION}" --notes-file release-notes.md
