name: "Publish npm Package"

on:
  push:
    branches:
      - main

permissions:
  id-token: write # required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest # must be a GitHub-hosted runner for OIDC

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: 🔧 Upgrade npm
        run: npm install -g npm@latest # OIDC trusted publishing requires npm >= 11.5.1

      - name: 🔧 Install dependencies
        run: npm ci

      - name: 🔧 Build package
        run: npm run build

      - name: 🚀 Publish package
        run: npm publish # npm auto-detects OIDC; no NODE_AUTH_TOKEN needed
