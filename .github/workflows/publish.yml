name: "Publish npm Package"

on:
  push:
    branches:
      - main

permissions:
  id-token: write # required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest # must be a GitHub-hosted runner for OIDC

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: 🔧 Upgrade npm
        run: npm install -g npm@12.0.2 # OIDC trusted publishing requires npm >= 11.5.1

      - name: 🔧 Install dependencies
        run: npm ci

      - name: 🔎 Check package version
        id: package-version
        run: |
          PACKAGE_NAME=$(node --print "require('./package.json').name")
          PACKAGE_VERSION=$(node --print "require('./package.json').version")

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version > /dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Publish package
        if: steps.package-version.outputs.should_publish == 'true'
        run: npm publish # prepublishOnly builds; npm auto-detects OIDC
