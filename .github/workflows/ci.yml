name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & package lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # --ignore-scripts: no dependency install scripts run in CI.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm run lint:package

  test:
    name: Test (Node ${{ matrix.node }}, Vite ${{ matrix.vite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24", "26"]
        vite: ["5", "6", "7", "8"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci --ignore-scripts

      - name: Install Vite ${{ matrix.vite }}
        if: matrix.vite != '8'
        run: npm install --no-save --ignore-scripts "vite@${{ matrix.vite }}"

      - run: npm test
